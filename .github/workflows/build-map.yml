# 每月自動建置台灣離線地圖資料，發布成 GitHub Release。
# 各台電腦上的地圖服務會自動下載最新的 Release，不需要自己建置。
# 想立刻建一版：GitHub 上的 Actions → 每月建置地圖資料 → Run workflow
name: 每月建置地圖資料

on:
  schedule:
    - cron: "17 18 1 * *"   # 每月 2 日 02:17（台灣時間）
  workflow_dispatch:
    inputs:
      use_address_seed:
        description: "改用 address-seed 裡的地址資料庫（換了新的地址資料時勾選）"
        type: boolean
        default: false

permissions:
  contents: write           # 發布 Release、更新 LATEST.md

concurrency:
  group: build-map
  cancel-in-progress: false

env:
  KEEP_RELEASES: 3          # GitHub 上保留幾版

jobs:
  build:
    runs-on: ubuntu-24.04     # 固定版本，GitHub 換新系統時不會突然壞掉
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_XMX: 8g
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 安裝 sqlite3
        run: command -v sqlite3 || (sudo apt-get update -q && sudo apt-get install -y -q sqlite3)

      - name: 快取建置工具與底圖素材
        uses: actions/cache@v6
        with:
          path: tools
          key: tools-${{ hashFiles('bin/common.sh') }}
          restore-keys: tools-

      - name: 決定版本名稱、取得上一版
        run: |
          name=$(TZ=Asia/Taipei date +%Y-%m-%d)
          if gh release view "map-$name" >/dev/null 2>&1; then
            name="$name-$(TZ=Asia/Taipei date +%H%M)"
          fi
          echo "RELEASE_NAME=$name" >> "$GITHUB_ENV"
          echo "這一版：$name"

          mkdir -p prev
          latest=$(gh release list --limit 100 --json tagName,isPrerelease,isDraft \
            --jq '[.[] | select((.tagName | startswith("map-")) and (.isPrerelease | not) and (.isDraft | not))][0].tagName // empty')
          if [ -n "$latest" ]; then
            echo "上一版：$latest"
            gh release download "$latest" --pattern release.properties --dir prev
            echo "PREV_PROPERTIES=$PWD/prev/release.properties" >> "$GITHUB_ENV"
            if [ "${{ inputs.use_address_seed }}" != "true" ]; then
              gh release download "$latest" --pattern 'taiwan_address.db.gz' --dir prev || true
            fi
          fi
          if ! ls prev/taiwan_address.db* >/dev/null 2>&1; then
            if gh release view address-seed >/dev/null 2>&1; then
              echo "使用 address-seed 的地址資料庫"
              gh release download address-seed --pattern 'taiwan_address.db*' --dir prev
            else
              echo "::error::找不到地址資料庫。請先建立名為 address-seed 的 Release 並上傳 taiwan_address.db（見 README）"
              exit 1
            fi
          fi
          db=$(ls prev/taiwan_address.db* | head -1)
          echo "地址資料庫：$db"
          echo "ADDRESS_DB=$PWD/$db" >> "$GITHUB_ENV"

      - name: 建置
        run: bash bin/build.sh dist

      - name: 發布 Release
        run: |
          gh release create "map-$RELEASE_NAME" \
            dist/taiwan.mbtiles dist/graph-cache.zip dist/taiwan_address.db.gz dist/release.properties \
            --title "地圖資料 $RELEASE_NAME" --notes-file dist/NOTES.md --latest

      - name: 更新 LATEST.md
        run: |
          {
            echo "# 目前最新的地圖資料"
            echo
            echo "此檔案由 GitHub Actions 自動更新，請勿手動修改。"
            echo
            echo '```'
            grep -vE '^(#|sha256\.|size\.|files=)' dist/release.properties
            echo '```'
          } > LATEST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST.md
          git commit -m "chore: 地圖資料更新到 $RELEASE_NAME" || exit 0
          git push

      - name: 刪除過舊的版本
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^map-' | sort -r | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r tag; do
                echo "刪除 $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
