# 地圖服務設定（Mac、Windows、Linux 共用）

# 從哪個 GitHub repo 下載地圖資料，格式「帳號/repo名稱」。
# 留空會自動從 git 的 origin 判斷（用 git clone 下載的就不用填）。
github.repo=

# 路線服務的埠號。bind.host 維持 127.0.0.1 表示只有本機能連；
# 要讓其他電腦連，請改成 0.0.0.0 並自行用防火牆限制來源。
port=8989
admin.port=8990
bind.host=127.0.0.1

# GraphHopper 最多可用記憶體（台灣 2g 就夠，記憶體充足可以調高）
java.xmx=2g

# 每隔幾小時檢查一次有沒有新版
check.interval.hours=24

# 本機保留幾個版本（含使用中的），出問題時可以退回
keep.releases=2
